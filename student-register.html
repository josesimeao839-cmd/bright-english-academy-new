<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Bright English Academy - Student Registration">

<title>Student Register | Bright English Academy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #0757c9,
            #13a6e8
        );

    padding:20px;
}

.register-card{
    width:100%;
    max-width:450px;
    background:white;
    border-radius:22px;
    padding:35px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.20);
}

.logo{
    text-align:center;
    font-size:25px;
    font-weight:800;
    color:#0757c9;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:25px;
}

.icon{
    text-align:center;
    font-size:55px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    color:#17233c;
    font-size:26px;
    margin-bottom:8px;
}

.description{
    text-align:center;
    color:#64748b;
    font-size:14px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    color:#17233c;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #dce5f1;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#0757c9;

    box-shadow:
        0 0 0 3px
        rgba(7,87,201,.10);
}

.input-wrapper{
    position:relative;
}

.input-wrapper input{
    padding-right:45px;
}

.password-toggle{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);

    border:none;
    background:none;
    cursor:pointer;

    font-size:18px;
}

.register-btn{
    width:100%;
    border:none;
    padding:14px;
    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #0757c9,
            #13a6e8
        );

    color:white;
    font-size:16px;
    font-weight:bold;

    cursor:pointer;
    margin-top:5px;
}

.register-btn:hover{
    opacity:.92;
}

.register-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:15px;
    border-radius:10px;
    margin-bottom:18px;

    font-size:14px;
    text-align:center;
    line-height:1.5;
}

.error{
    background:#fff0f0;
    color:#c62828;
    border:1px solid #ffcaca;
}

.success{
    background:#effff5;
    color:#138a4b;
    border:1px solid #bcefd0;
}

.info{
    background:#eef7ff;
    color:#0757c9;
    border:1px solid #c7e3ff;
}

.status-title{
    font-weight:bold;
    display:block;
    margin-bottom:5px;
}

.login-link{
    text-align:center;
    margin-top:22px;
    color:#64748b;
    font-size:14px;
}

.login-link a{
    color:#0757c9;
    font-weight:bold;
    text-decoration:none;
}

.login-link a:hover{
    text-decoration:underline;
}

.back-link{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#0757c9;
    font-weight:bold;
    text-decoration:none;
    font-size:14px;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#64748b;
    font-size:13px;
}

.footer strong{
    color:#0757c9;
}

</style>

</head>

<body>

<div class="register-card">

<div class="logo">
📚 Bright English Academy
</div>

<div class="subtitle">
Student Portal
</div>

<div class="icon">
👨‍🎓
</div>

<h1>
Create Student Account
</h1>

<p class="description">
Create your account and start learning English.
</p>


<!-- ERROR MESSAGE -->

<div
id="errorBox"
class="message error">
</div>


<!-- SUCCESS MESSAGE -->

<div
id="successBox"
class="message success">
</div>


<!-- INFO MESSAGE -->

<div
id="infoBox"
class="message info">
</div>


<!-- FULL NAME -->

<div class="form-group">

<label for="fullName">
Full Name
</label>

<input
id="fullName"
type="text"
placeholder="Enter your full name"
autocomplete="name">

</div>


<!-- EMAIL -->

<div class="form-group">

<label for="email">
Email
</label>

<input
id="email"
type="email"
placeholder="Enter your email"
autocomplete="email">

</div>


<!-- PASSWORD -->

<div class="form-group">

<label for="password">
Password
</label>

<div class="input-wrapper">

<input
id="password"
type="password"
placeholder="Create a password"
autocomplete="new-password">

<button
type="button"
class="password-toggle"
onclick="togglePassword('password')">

👁️

</button>

</div>

</div>


<!-- CONFIRM PASSWORD -->

<div class="form-group">

<label for="confirmPassword">
Confirm Password
</label>

<div class="input-wrapper">

<input
id="confirmPassword"
type="password"
placeholder="Confirm your password"
autocomplete="new-password">

<button
type="button"
class="password-toggle"
onclick="togglePassword('confirmPassword')">

👁️

</button>

</div>

</div>


<!-- REGISTER -->

<button
id="registerBtn"
class="register-btn"
onclick="registerStudent()">

🚀 Create Student Account

</button>


<div class="login-link">

Already have an account?

<a href="student-login.html">
Student Login
</a>

</div>


<a
href="index.html"
class="back-link">

← Back to Bright English Academy

</a>


<div class="footer">

<p>
<strong>
Bright English Academy
</strong>
</p>

<p>
Speak English with Confidence
</p>

<p style="margin-top:6px;">
👤 Created by
<strong>
José Simeão
</strong>
</p>

</div>

</div>


<script>

/* =========================================
   SUPABASE - NEW PROJECT
========================================= */

const SUPABASE_URL =
"https://yvdadrqimaavubqcxned.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YALE2o5AFLktfK39sjgPBA_u_W49CbT";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   PASSWORD TOGGLE
========================================= */

function togglePassword(id){

    const input =
        document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

    }else{

        input.type = "password";

    }

}


/* =========================================
   MESSAGES
========================================= */

function hideMessages(){

    document.getElementById(
        "errorBox"
    ).style.display = "none";

    document.getElementById(
        "successBox"
    ).style.display = "none";

    document.getElementById(
        "infoBox"
    ).style.display = "none";

}


function showError(message){

    hideMessages();

    const box =
        document.getElementById(
            "errorBox"
        );

    box.innerHTML =
        "<span class='status-title'>❌ Registration Error</span>"
        + message;

    box.style.display = "block";

}


function showSuccess(message){

    hideMessages();

    const box =
        document.getElementById(
            "successBox"
        );

    box.innerHTML =
        "<span class='status-title'>✅ Success</span>"
        + message;

    box.style.display = "block";

}


function showInfo(message){

    hideMessages();

    const box =
        document.getElementById(
            "infoBox"
        );

    box.innerHTML =
        "<span class='status-title'>ℹ️ Information</span>"
        + message;

    box.style.display = "block";

}


/* =========================================
   REGISTER STUDENT
========================================= */

async function registerStudent(){

    hideMessages();


    const fullName =
        document.getElementById(
            "fullName"
        ).value.trim();


    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;


    /* =====================================
       VALIDATION
    ===================================== */

    if(!fullName){

        showError(
            "Please enter your full name."
        );

        return;
    }


    if(!email){

        showError(
            "Please enter your email."
        );

        return;
    }


    if(!password){

        showError(
            "Please create a password."
        );

        return;
    }


    if(password.length < 6){

        showError(
            "Password must contain at least 6 characters."
        );

        return;
    }


    if(password !== confirmPassword){

        showError(
            "Passwords do not match."
        );

        return;
    }


    /* =====================================
       BUTTON
    ===================================== */

    const button =
        document.getElementById(
            "registerBtn"
        );


    button.disabled = true;

    button.textContent =
        "⏳ Creating account...";


    showInfo(
        "Connecting to Bright English Academy..."
    );


    try{

        /* =================================
           SUPABASE AUTH
        ================================= */

        const result =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options:{

                    data:{

                        full_name:
                            fullName,

                        role:
                            "student"

                    }

                }

            });


        const data =
            result.data;

        const error =
            result.error;


        /* =================================
           AUTH ERROR
        ================================= */

        if(error){

            console.error(
                "Supabase Auth Error:",
                error
            );

            showError(
                error.message
            );

            button.disabled = false;

            button.textContent =
                "🚀 Create Student Account";

            return;
        }


        /* =================================
           USER CHECK
        ================================= */

        if(
            !data ||
            !data.user
        ){

            showError(
                "The account could not be created. Please try again."
            );

            button.disabled = false;

            button.textContent =
                "🚀 Create Student Account";

            return;
        }


        const userId =
            data.user.id;


        /* =================================
           PROFILE
        ================================= */

        showInfo(
            "Account created. Creating student profile..."
        );


        const profileResult =
            await supabaseClient
                .from("profiles")
                .upsert({

                    id:
                        userId,

                    full_name:
                        fullName,

                    role:
                        "student"

                });


        const profileError =
            profileResult.error;


        if(profileError){

            console.error(
                "Profile Error:",
                profileError
            );


            /*
             Account exists even if
             profile creation failed.
            */

            showError(
                "Your account was created, but the student profile could not be created. Please check the profiles table permissions in Supabase."
            );


            button.disabled = false;

            button.textContent =
                "🚀 Create Student Account";

            return;
        }


        /* =================================
           CHECK SESSION
        ================================= */

        const sessionResult =
            await supabaseClient.auth.getSession();


        const session =
            sessionResult.data.session;


        /* =================================
           EMAIL CONFIRMATION
        ================================= */

        if(!session){

            showSuccess(
                "Your account was created successfully! Please check your email to confirm your account before logging in."
            );


            button.disabled = false;

            button.textContent =
                "✅ Account Created";


            return;
        }


        /* =================================
           FINAL SUCCESS
        ================================= */

        showSuccess(
            "Account created successfully! Opening Student Dashboard..."
        );


        button.textContent =
            "✅ Account Created";


        setTimeout(
            function(){

                window.location.href =
                    "student-dashboard.html";

            },
            1200
        );


    }
    catch(error){

        console.error(
            "Unexpected Error:",
            error
        );


        showError(
            "An unexpected error occurred. Please try again."
        );


        button.disabled = false;

        button.textContent =
            "🚀 Create Student Account";

    }

}


/* =========================================
   ENTER KEY
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            registerStudent();

        }

    }
);

</script>

</body>

</html>
