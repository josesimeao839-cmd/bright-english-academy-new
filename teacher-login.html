<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Teacher Login - Bright English Academy">

<title>Teacher Login | Bright English Academy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    background:
    linear-gradient(
        135deg,
        #eef6ff,
        #f7fbff
    );

    color:#17233c;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.container{

    width:100%;

    max-width:460px;

}

.card{

    background:white;

    padding:35px;

    border-radius:22px;

    border:1px solid #e0e7f1;

    box-shadow:
        0 15px 45px
        rgba(20,53,100,.12);

}

.logo{

    text-align:center;

    margin-bottom:25px;

}

.logo-icon{

    width:70px;

    height:70px;

    margin:auto;

    margin-bottom:14px;

    border-radius:20px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
    linear-gradient(
        135deg,
        #0757c9,
        #13a6e8
    );

    color:white;

    font-size:36px;

}

.logo h1{

    color:#0757c9;

    font-size:25px;

    margin-bottom:5px;

}

.logo p{

    color:#64748b;

    font-size:14px;

}

.portal{

    text-align:center;

    color:#64748b;

    font-size:13px;

    font-weight:bold;

    margin-bottom:25px;

    text-transform:uppercase;

    letter-spacing:.8px;

}

.message{

    display:none;

    padding:13px;

    border-radius:10px;

    margin-bottom:18px;

    font-size:14px;

    line-height:1.5;

    font-weight:bold;

}

.message.error{

    display:block;

    background:#fff0f0;

    color:#c62828;

}

.message.success{

    display:block;

    background:#e8f7ee;

    color:#147844;

}

.message.info{

    display:block;

    background:#eaf3ff;

    color:#0757c9;

}

.form-group{

    margin-bottom:18px;

}

.form-group label{

    display:block;

    font-size:14px;

    font-weight:bold;

    margin-bottom:7px;

}

.input-wrapper{

    position:relative;

}

.form-group input{

    width:100%;

    padding:13px 48px 13px 14px;

    border:

    1px solid #d5dfeb;

    border-radius:10px;

    outline:none;

    font-size:15px;

    transition:.2s;

}

.form-group input:focus{

    border-color:#0757c9;

    box-shadow:
    0 0 0 3px
    rgba(7,87,201,.10);

}

.password-toggle{

    position:absolute;

    right:10px;

    top:50%;

    transform:translateY(-50%);

    border:none;

    background:transparent;

    cursor:pointer;

    font-size:20px;

    padding:5px;

}

.login-btn{

    width:100%;

    border:none;

    padding:14px;

    border-radius:10px;

    background:
    linear-gradient(
        135deg,
        #0757c9,
        #13a6e8
    );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    margin-top:5px;

}

.login-btn:hover{

    opacity:.93;

}

.login-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

}

.back{

    display:block;

    text-align:center;

    margin-top:20px;

    color:#0757c9;

    text-decoration:none;

    font-weight:bold;

    font-size:14px;

}

.back:hover{

    text-decoration:underline;

}

.footer{

    text-align:center;

    margin-top:18px;

    color:#64748b;

    font-size:12px;

}

.footer strong{

    color:#0757c9;

}

@media(max-width:500px){

    .card{

        padding:25px 20px;

    }

}

</style>

</head>

<body>


<div class="container">


<div class="card">


<div class="logo">

<div class="logo-icon">
👨‍🏫
</div>

<h1>
Bright English Academy
</h1>

<p>
Speak English with Confidence
</p>

</div>


<div class="portal">
Teacher Portal
</div>


<div
id="message"
class="message">
</div>


<form
id="teacherLoginForm"
onsubmit="teacherLogin(event)">


<div class="form-group">

<label for="teacherEmail">
Teacher Email
</label>

<input
type="email"
id="teacherEmail"
placeholder="Enter teacher email"
autocomplete="email"
required>

</div>


<div class="form-group">

<label for="teacherPassword">
Password
</label>


<div class="input-wrapper">

<input
type="password"
id="teacherPassword"
placeholder="Enter your password"
autocomplete="current-password"
required>


<button
type="button"
class="password-toggle"
id="passwordToggle"
onclick="togglePassword()"
aria-label="Show password">

👁️

</button>

</div>

</div>


<button
type="submit"
id="loginButton"
class="login-btn">

🔐 Access Teacher Dashboard

</button>


</form>


<a
href="index.html"
class="back">

← Back to Bright English Academy

</a>


</div>


<div class="footer">

<p>

<strong>
Bright English Academy
</strong>

</p>

<p>
Created by José Simeão
</p>

</div>


</div>



<script>

/* =====================================================
   SUPABASE — NEW PROJECT
===================================================== */

const SUPABASE_URL =
"https://yvdadrqimaavubqcxned.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_YALE2o5AFLktfK39sjgPBA_u_W49CbT";


/* =====================================================
   CREATE SUPABASE CLIENT
===================================================== */

const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_PUBLISHABLE_KEY,

    {

        auth:{

            autoRefreshToken:true,

            persistSession:true,

            detectSessionInUrl:true

        }

    }

);


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

    message.className =
        "message " + type;

}


function clearMessage(){

    const message =
        document.getElementById(
            "message"
        );

    message.textContent = "";

    message.className =
        "message";

}


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

function togglePassword(){

    const password =
        document.getElementById(
            "teacherPassword"
        );

    const button =
        document.getElementById(
            "passwordToggle"
        );


    if(password.type === "password"){

        password.type = "text";

        button.textContent = "🙈";

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

    }
    else{

        password.type = "password";

        button.textContent = "👁️";

        button.setAttribute(
            "aria-label",
            "Show password"
        );

    }

}


/* =====================================================
   FRIENDLY ERROR
===================================================== */

function getFriendlyError(error){

    if(!error){

        return "Something went wrong.";

    }


    const message =
        error.message ||
        String(error);


    const lower =
        message.toLowerCase();


    if(
        lower.includes(
            "invalid login credentials"
        )
    ){

        return "Incorrect teacher email or password.";

    }


    if(
        lower.includes(
            "email not confirmed"
        )
    ){

        return "Please confirm the teacher email before logging in.";

    }


    if(
        lower.includes(
            "invalid api key"
        )
    ){

        return "The new Supabase Publishable Key was rejected. Check that this page is using the NEW Supabase project.";

    }


    if(
        lower.includes(
            "failed to fetch"
        )
    ){

        return "Could not connect to the new Supabase project. Check your internet connection and make sure this page is using the NEW Supabase URL.";

    }


    if(
        lower.includes(
            "networkerror"
        )
    ){

        return "Network error. Please check your internet connection.";

    }


    return message;

}


/* =====================================================
   TEACHER LOGIN
===================================================== */

async function teacherLogin(event){

    event.preventDefault();


    clearMessage();


    const email =
        document.getElementById(
            "teacherEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "teacherPassword"
        ).value;


    const button =
        document.getElementById(
            "loginButton"
        );


    if(!email || !password){

        showMessage(
            "❌ Please enter your teacher email and password.",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "Checking account...";


    showMessage(
        "⏳ Connecting to Bright English Academy...",
        "info"
    );


    try{


        /* =============================================
           SIGN IN
        ============================================= */

        const result =
            await supabaseClient.auth.signInWithPassword({

                email:email,

                password:password

            });


        const data =
            result.data;

        const error =
            result.error;


        if(error){

            throw error;

        }


        if(
            !data ||
            !data.user
        ){

            throw new Error(
                "Teacher account could not be found."
            );

        }


        const user =
            data.user;


        /* =============================================
           GET TEACHER PROFILE
        ============================================= */

        const profileResult =
            await supabaseClient
                .from("profiles")
                .select(
                    "id, full_name, role"
                )
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle();


        if(profileResult.error){

            throw profileResult.error;

        }


        let profile =
            profileResult.data;


        /* =============================================
           PROFILE DOES NOT EXIST
        ============================================= */

        if(!profile){

            await supabaseClient.auth.signOut();


            throw new Error(
                "This account does not have a teacher profile. Please create the teacher profile in Supabase first."
            );

        }


        /* =============================================
           VERIFY TEACHER ROLE
        ============================================= */

        if(profile.role !== "teacher"){

            await supabaseClient.auth.signOut();


            throw new Error(
                "This account is not registered as a teacher."
            );

        }


        /* =============================================
           SAVE TEACHER SESSION
        ============================================= */

        localStorage.setItem(
            "brightAcademyTeacherLoggedIn",
            "true"
        );


        localStorage.setItem(
            "brightAcademyTeacher",

            JSON.stringify({

                id:user.id,

                fullname:
                    profile.full_name ||
                    user.email,

                email:
                    user.email,

                role:"teacher"

            })

        );


        /* =============================================
           SUCCESS
        ============================================= */

        showMessage(
            "✅ Teacher login successful! Opening dashboard...",
            "success"
        );


        setTimeout(

            function(){

                window.location.href =
                    "teacher-dashboard.html";

            },

            700

        );


    }
    catch(error){

        console.error(
            "Teacher login error:",
            error
        );


        showMessage(
            "❌ " +
            getFriendlyError(error),
            "error"
        );


        button.disabled = false;

        button.textContent =
            "🔐 Access Teacher Dashboard";

    }

}


/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkExistingTeacherSession(){

    try{

        const result =
            await supabaseClient.auth.getSession();


        if(result.error){

            console.error(
                "Session error:",
                result.error
            );

            return;

        }


        const session =
            result.data?.session;


        if(
            !session ||
            !session.user
        ){

            return;

        }


        const user =
            session.user;


        const profileResult =
            await supabaseClient
                .from("profiles")
                .select(
                    "id, full_name, role"
                )
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle();


        if(profileResult.error){

            console.error(
                "Profile check error:",
                profileResult.error
            );

            return;

        }


        const profile =
            profileResult.data;


        if(
            profile &&
            profile.role === "teacher"
        ){

            window.location.href =
                "teacher-dashboard.html";

        }

    }
    catch(error){

        console.error(
            "Session check failed:",
            error
        );

    }

}


/* =====================================================
   START
===================================================== */

checkExistingTeacherSession();

</script>


</body>

</html>
