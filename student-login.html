<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Student Login - Bright English Academy">

<title>Student Login | Bright English Academy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    background:
    linear-gradient(
        135deg,
        #eef6ff,
        #f7fbff
    );

    color:#17233c;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.login-container{

    width:100%;

    max-width:460px;

}

.login-card{

    background:white;

    padding:35px;

    border-radius:22px;

    border:1px solid #e0e7f1;

    box-shadow:
        0 15px 45px
        rgba(20,53,100,.12);

}

.logo{

    text-align:center;

    margin-bottom:25px;

}

.logo-icon{

    width:65px;

    height:65px;

    margin:0 auto 12px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #0757c9,
            #13a6e8
        );

    color:white;

    font-size:34px;

}

.logo h1{

    color:#0757c9;

    font-size:25px;

    margin-bottom:5px;

}

.logo p{

    color:#64748b;

    font-size:14px;

}

.tabs{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    background:#eef4fb;

    padding:5px;

    border-radius:10px;

    margin-bottom:25px;

}

.tab{

    border:none;

    padding:11px;

    border-radius:8px;

    background:transparent;

    color:#64748b;

    font-weight:bold;

    cursor:pointer;

}

.tab.active{

    background:white;

    color:#0757c9;

    box-shadow:
        0 2px 8px
        rgba(20,53,100,.08);

}

.form-group{

    margin-bottom:17px;

}

.form-group label{

    display:block;

    margin-bottom:7px;

    font-size:14px;

    font-weight:bold;

    color:#17233c;

}

.input-wrapper{

    position:relative;

}

.form-group input{

    width:100%;

    padding:13px 48px 13px 14px;

    border:1px solid #d5dfeb;

    border-radius:10px;

    outline:none;

    font-size:15px;

    transition:.2s;

}

.form-group input:focus{

    border-color:#0757c9;

    box-shadow:
        0 0 0 3px
        rgba(7,87,201,.10);

}

.password-toggle{

    position:absolute;

    right:9px;

    top:50%;

    transform:translateY(-50%);

    border:none;

    background:transparent;

    cursor:pointer;

    font-size:20px;

    padding:5px;

}

.main-btn{

    width:100%;

    border:none;

    padding:14px;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #0757c9,
            #13a6e8
        );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    margin-top:5px;

}

.main-btn:hover{

    opacity:.93;

}

.main-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

}

.message{

    display:none;

    padding:13px;

    border-radius:9px;

    margin-bottom:18px;

    font-size:14px;

    font-weight:bold;

    line-height:1.5;

}

.message.success{

    display:block;

    background:#e8f7ee;

    color:#147844;

}

.message.error{

    display:block;

    background:#fff0f0;

    color:#c62828;

}

.message.info{

    display:block;

    background:#eaf3ff;

    color:#0757c9;

}

.hidden{

    display:none !important;

}

.back-link{

    display:block;

    text-align:center;

    margin-top:20px;

    color:#0757c9;

    text-decoration:none;

    font-weight:bold;

    font-size:14px;

}

.back-link:hover{

    text-decoration:underline;

}

.footer{

    text-align:center;

    margin-top:18px;

    color:#64748b;

    font-size:12px;

}

.footer strong{

    color:#0757c9;

}

@media(max-width:500px){

    .login-card{

        padding:25px 20px;

    }

}

</style>

</head>

<body>


<div class="login-container">


<div class="login-card">


<div class="logo">

<div class="logo-icon">
📚
</div>

<h1>
Bright English Academy
</h1>

<p>
Speak English with Confidence
</p>

</div>


<div class="tabs">

<button
id="loginTab"
class="tab active"
type="button"
onclick="showLogin()">

Login

</button>


<button
id="registerTab"
class="tab"
type="button"
onclick="showRegister()">

Register

</button>

</div>


<div
id="message"
class="message">
</div>


<!-- =========================
     LOGIN
========================= -->

<form
id="loginForm"
onsubmit="loginStudent(event)">


<div class="form-group">

<label for="loginEmail">
Email
</label>

<input
type="email"
id="loginEmail"
placeholder="Enter your email"
autocomplete="email"
required>

</div>


<div class="form-group">

<label for="loginPassword">
Password
</label>

<div class="input-wrapper">

<input
type="password"
id="loginPassword"
placeholder="Enter your password"
autocomplete="current-password"
required>

<button
type="button"
class="password-toggle"
onclick="togglePassword('loginPassword','loginEye')"
id="loginEye">

👁️

</button>

</div>

</div>


<button
id="loginButton"
class="main-btn"
type="submit">

🔐 Login

</button>


</form>


<!-- =========================
     REGISTER
========================= -->

<form
id="registerForm"
class="hidden"
onsubmit="registerStudent(event)">


<div class="form-group">

<label for="registerName">
Full Name
</label>

<input
type="text"
id="registerName"
placeholder="Enter your full name"
autocomplete="name"
required>

</div>


<div class="form-group">

<label for="registerEmail">
Email
</label>

<input
type="email"
id="registerEmail"
placeholder="Enter your email"
autocomplete="email"
required>

</div>


<div class="form-group">

<label for="registerPassword">
Password
</label>

<div class="input-wrapper">

<input
type="password"
id="registerPassword"
placeholder="Create a password"
autocomplete="new-password"
minlength="6"
required>

<button
type="button"
class="password-toggle"
onclick="togglePassword('registerPassword','registerEye')"
id="registerEye">

👁️

</button>

</div>

</div>


<div class="form-group">

<label for="registerPassword2">
Confirm Password
</label>

<div class="input-wrapper">

<input
type="password"
id="registerPassword2"
placeholder="Repeat your password"
autocomplete="new-password"
minlength="6"
required>

<button
type="button"
class="password-toggle"
onclick="togglePassword('registerPassword2','registerEye2')"
id="registerEye2">

👁️

</button>

</div>

</div>


<button
id="registerButton"
class="main-btn"
type="submit">

📝 Create Student Account

</button>


</form>


<a
href="index.html"
class="back-link">

← Back to Bright English Academy

</a>


</div>


<div class="footer">

<p>
<strong>
Bright English Academy
</strong>
</p>

<p>
Created by José Simeão
</p>

</div>


</div>


<script>

/* =====================================================
   NEW SUPABASE PROJECT
===================================================== */

const SUPABASE_URL =
"https://yvdadrqimaavubqcxned.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_YALE2o5AFLktfK39sjgPBA_u_W49CbT";


const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_PUBLISHABLE_KEY,

    {

        auth:{

            autoRefreshToken:true,

            persistSession:true,

            detectSessionInUrl:true

        }

    }

);


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

}


function clearMessage(){

    const message =
        document.getElementById("message");

    message.textContent = "";

    message.className = "message";

}


/* =====================================================
   TABS
===================================================== */

function showLogin(){

    document
        .getElementById("loginForm")
        .classList.remove("hidden");

    document
        .getElementById("registerForm")
        .classList.add("hidden");

    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("registerTab")
        .classList.remove("active");

    clearMessage();

}


function showRegister(){

    document
        .getElementById("registerForm")
        .classList.remove("hidden");

    document
        .getElementById("loginForm")
        .classList.add("hidden");

    document
        .getElementById("registerTab")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.remove("active");

    clearMessage();

}


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

function togglePassword(
    inputId,
    buttonId
){

    const input =
        document.getElementById(inputId);

    const button =
        document.getElementById(buttonId);


    if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

    }
    else{

        input.type = "password";

        button.textContent = "👁️";

    }

}


/* =====================================================
   REGISTER STUDENT
===================================================== */

async function registerStudent(event){

    event.preventDefault();

    clearMessage();


    const name =
        document
        .getElementById("registerName")
        .value
        .trim();


    const email =
        document
        .getElementById("registerEmail")
        .value
        .trim()
        .toLowerCase();


    const password =
        document
        .getElementById("registerPassword")
        .value;


    const password2 =
        document
        .getElementById("registerPassword2")
        .value;


    if(!name){

        showMessage(
            "❌ Please enter your full name.",
            "error"
        );

        return;

    }


    if(password.length < 6){

        showMessage(
            "❌ Password must contain at least 6 characters.",
            "error"
        );

        return;

    }


    if(password !== password2){

        showMessage(
            "❌ The passwords do not match.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "registerButton"
        );


    button.disabled = true;

    button.textContent =
        "Creating account...";


    showMessage(
        "⏳ Creating your student account...",
        "info"
    );


    try{

        /* =========================================
           CREATE AUTH ACCOUNT
        ========================================= */

        const result =
            await supabaseClient.auth.signUp({

                email:email,

                password:password,

                options:{

                    data:{

                        full_name:name,

                        role:"student"

                    }

                }

            });


        const data =
            result.data;

        const error =
            result.error;


        if(error){

            throw error;

        }


        if(!data || !data.user){

            throw new Error(
                "Supabase did not return a student account."
            );

        }


        /* =========================================
           IF SESSION EXISTS
        ========================================= */

        if(data.session){

            const profileResult =
                await supabaseClient
                    .from("profiles")
                    .upsert({

                        id:data.user.id,

                        full_name:name,

                        role:"student"

                    });


            if(profileResult.error){

                console.error(
                    "Profile creation error:",
                    profileResult.error
                );

            }


            localStorage.setItem(
                "brightAcademyLoggedIn",
                "true"
            );


            localStorage.setItem(
                "brightAcademyStudent",

                JSON.stringify({

                    id:data.user.id,

                    fullname:name,

                    email:email

                })

            );


            showMessage(
                "✅ Account created! Opening your dashboard...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "student-dashboard.html";

                },
                900
            );

            return;

        }


        /* =========================================
           EMAIL CONFIRMATION
        ========================================= */

        showMessage(
            "✅ Account created! Please check your email to confirm your account, then return and log in.",
            "success"
        );


        document
            .getElementById("registerForm")
            .reset();

    }
    catch(error){

        console.error(
            "REGISTER ERROR:",
            error
        );


        showMessage(
            "❌ " +
            getFriendlyError(error),
            "error"
        );

    }
    finally{

        button.disabled = false;

        button.textContent =
            "📝 Create Student Account";

    }

}


/* =====================================================
   LOGIN STUDENT
===================================================== */

async function loginStudent(event){

    event.preventDefault();

    clearMessage();


    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim()
        .toLowerCase();


    const password =
        document
        .getElementById("loginPassword")
        .value;


    const button =
        document.getElementById(
            "loginButton"
        );


    button.disabled = true;

    button.textContent =
        "Logging in...";


    showMessage(
        "⏳ Checking your account...",
        "info"
    );


    try{

        const result =
            await supabaseClient.auth
                .signInWithPassword({

                    email:email,

                    password:password

                });


        if(result.error){

            throw result.error;

        }


        const user =
            result.data?.user;


        if(!user){

            throw new Error(
                "Student account not found."
            );

        }


        /* =========================================
           GET PROFILE
        ========================================= */

        let profile = null;


        const profileResult =
            await supabaseClient
                .from("profiles")
                .select(
                    "id, full_name, role"
                )
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle();


        if(profileResult.error){

            throw profileResult.error;

        }


        profile =
            profileResult.data;


        /* =========================================
           CREATE PROFILE IF MISSING
        ========================================= */

        if(!profile){

            const name =
                user.user_metadata?.full_name ||
                email.split("@")[0];


            const newProfile =
                await supabaseClient
                    .from("profiles")
                    .insert({

                        id:user.id,

                        full_name:name,

                        role:"student"

                    })
                    .select()
                    .single();


            if(newProfile.error){

                throw newProfile.error;

            }


            profile =
                newProfile.data;

        }


        /* =========================================
           BLOCK TEACHER
        ========================================= */

        if(profile.role === "teacher"){

            await supabaseClient.auth.signOut();

            throw new Error(
                "This is a teacher account. Please use the teacher login."
            );

        }


        /* =========================================
           SAVE STUDENT
        ========================================= */

        localStorage.setItem(
            "brightAcademyLoggedIn",
            "true"
        );


        localStorage.setItem(
            "brightAcademyStudent",

            JSON.stringify({

                id:user.id,

                fullname:
                    profile.full_name,

                email:
                    user.email

            })

        );


        showMessage(
            "✅ Login successful! Opening your dashboard...",
            "success"
        );


        setTimeout(
            function(){

                window.location.href =
                    "student-dashboard.html";

            },
            700
        );

    }
    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        showMessage(
            "❌ " +
            getFriendlyError(error),
            "error"
        );


        button.disabled = false;

        button.textContent =
            "🔐 Login";

    }

}


/* =====================================================
   FRIENDLY ERRORS
===================================================== */

function getFriendlyError(error){

    const message =
        error?.message ||
        "Something went wrong.";


    const lower =
        message.toLowerCase();


    if(
        lower.includes(
            "failed to fetch"
        )
    ){

        return "Could not connect to the new Supabase project. Please check the Supabase URL and Publishable Key.";

    }


    if(
        lower.includes(
            "invalid api key"
        )
    ){

        return "The Supabase Publishable Key is invalid for this project.";

    }


    if(
        lower.includes(
            "user already registered"
        )
    ){

        return "This email is already registered. Please use Login.";

    }


    if(
        lower.includes(
            "invalid login credentials"
        )
    ){

        return "Email or password is incorrect.";

    }


    if(
        lower.includes(
            "email not confirmed"
        )
    ){

        return "Please confirm your email before logging in.";

    }


    if(
        lower.includes(
            "password should be at least"
        )
    ){

        return "Password must contain at least 6 characters.";

    }


    return message;

}


/* =====================================================
   EXISTING SESSION
===================================================== */

async function checkExistingSession(){

    try{

        const result =
            await supabaseClient.auth
                .getSession();


        if(result.error){

            console.error(
                result.error
            );

            return;

        }


        const session =
            result.data?.session;


        if(
            !session ||
            !session.user
        ){

            return;

        }


        const user =
            session.user;


        const profileResult =
            await supabaseClient
                .from("profiles")
                .select(
                    "id, full_name, role"
                )
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle();


        if(profileResult.error){

            console.error(
                profileResult.error
            );

            return;

        }


        const profile =
            profileResult.data;


        if(
            profile &&
            profile.role === "student"
        ){

            window.location.href =
                "student-dashboard.html";

        }

    }
    catch(error){

        console.error(
            "SESSION ERROR:",
            error
        );

    }

}


/* =====================================================
   START
===================================================== */

checkExistingSession();

</script>

</body>

</html>
