<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="Student Login - Bright English Academy">

<title>Student Login | Bright English Academy</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #eef6ff,
        #f7fbff
    );

    color:#17233c;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}


/* =========================
   CONTAINER
========================= */

.login-container{

    width:100%;

    max-width:460px;

}


/* =========================
   CARD
========================= */

.login-card{

    background:white;

    padding:35px;

    border-radius:22px;

    border:1px solid #e0e7f1;

    box-shadow:
        0 15px 45px
        rgba(20,53,100,.12);

}


/* =========================
   LOGO
========================= */

.logo{

    text-align:center;

    margin-bottom:25px;

}


.logo-icon{

    width:65px;

    height:65px;

    margin:0 auto 12px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #0757c9,
            #13a6e8
        );

    color:white;

    font-size:34px;

}


.logo h1{

    color:#0757c9;

    font-size:25px;

    margin-bottom:5px;

}


.logo p{

    color:#64748b;

    font-size:14px;

}


/* =========================
   TABS
========================= */

.tabs{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    background:#eef4fb;

    padding:5px;

    border-radius:10px;

    margin-bottom:25px;

}


.tab{

    border:none;

    padding:11px;

    border-radius:8px;

    background:transparent;

    color:#64748b;

    font-weight:bold;

    cursor:pointer;

}


.tab.active{

    background:white;

    color:#0757c9;

    box-shadow:
        0 2px 8px
        rgba(20,53,100,.08);

}


/* =========================
   FORM
========================= */

.form-group{

    margin-bottom:17px;

}


.form-group label{

    display:block;

    margin-bottom:7px;

    font-size:14px;

    font-weight:bold;

    color:#17233c;

}


.form-group input{

    width:100%;

    padding:13px 14px;

    border:1px solid #d5dfeb;

    border-radius:10px;

    outline:none;

    font-size:15px;

    transition:.2s;

}


.form-group input:focus{

    border-color:#0757c9;

    box-shadow:
        0 0 0 3px
        rgba(7,87,201,.10);

}


/* =========================
   MAIN BUTTON
========================= */

.main-btn{

    width:100%;

    border:none;

    padding:14px;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #0757c9,
            #13a6e8
        );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    margin-top:5px;

}


.main-btn:hover{

    opacity:.93;

}


.main-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

}


/* =========================
   MESSAGE
========================= */

.message{

    display:none;

    padding:12px;

    border-radius:9px;

    margin-bottom:18px;

    font-size:14px;

    font-weight:bold;

}


.message.success{

    display:block;

    background:#e8f7ee;

    color:#147844;

}


.message.error{

    display:block;

    background:#fff0f0;

    color:#c62828;

}


.message.info{

    display:block;

    background:#eaf3ff;

    color:#0757c9;

}


/* =========================
   BACK
========================= */

.back-link{

    display:block;

    text-align:center;

    margin-top:20px;

    color:#0757c9;

    text-decoration:none;

    font-weight:bold;

    font-size:14px;

}


.back-link:hover{

    text-decoration:underline;

}


/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    margin-top:18px;

    color:#64748b;

    font-size:12px;

}


.footer strong{

    color:#0757c9;

}


/* =========================
   HIDDEN
========================= */

.hidden{

    display:none;

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .login-card{

        padding:25px 20px;

    }

}

</style>

</head>


<body>


<div class="login-container">


<div class="login-card">


<!-- =========================
     LOGO
========================= -->

<div class="logo">

<div class="logo-icon">
📚
</div>

<h1>
Bright English Academy
</h1>

<p>
Speak English with Confidence
</p>

</div>


<!-- =========================
     TABS
========================= -->

<div class="tabs">

<button
id="loginTab"
class="tab active"
onclick="showLogin()">

Login

</button>


<button
id="registerTab"
class="tab"
onclick="showRegister()">

Register

</button>

</div>


<!-- =========================
     MESSAGE
========================= -->

<div
id="message"
class="message">

</div>


<!-- =========================
     LOGIN FORM
========================= -->

<form
id="loginForm"
onsubmit="loginStudent(event)">


<div class="form-group">

<label for="loginEmail">

Email

</label>

<input
type="email"
id="loginEmail"
placeholder="Enter your email"
required>

</div>


<div class="form-group">

<label for="loginPassword">

Password

</label>

<input
type="password"
id="loginPassword"
placeholder="Enter your password"
required>

</div>


<button
id="loginButton"
class="main-btn"
type="submit">

🔐 Login

</button>


</form>


<!-- =========================
     REGISTER FORM
========================= -->

<form
id="registerForm"
class="hidden"
onsubmit="registerStudent(event)">


<div class="form-group">

<label for="registerName">

Full Name

</label>

<input
type="text"
id="registerName"
placeholder="Enter your full name"
required>

</div>


<div class="form-group">

<label for="registerEmail">

Email

</label>

<input
type="email"
id="registerEmail"
placeholder="Enter your email"
required>

</div>


<div class="form-group">

<label for="registerPassword">

Password

</label>

<input
type="password"
id="registerPassword"
placeholder="Create a password"
minlength="6"
required>

</div>


<div class="form-group">

<label for="registerPassword2">

Confirm Password

</label>

<input
type="password"
id="registerPassword2"
placeholder="Repeat your password"
minlength="6"
required>

</div>


<button
id="registerButton"
class="main-btn"
type="submit">

📝 Create Student Account

</button>


</form>


<a
href="index.html"
class="back-link">

← Back to Bright English Academy

</a>


</div>


<div class="footer">

<p>

<strong>
Bright English Academy
</strong>

</p>

<p>
Created by José Simeão
</p>

</div>


</div>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
    "https://yvdadrqimaavubqcxned.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_YALE2o5AFLktfK39sjgPBA_u_W4";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth:{
                autoRefreshToken:true,
                persistSession:true,
                detectSessionInUrl:true
            }
        }
    );


/* =====================================================
   MESSAGE SYSTEM
===================================================== */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;

}


/* =====================================================
   LOGIN TAB
===================================================== */

function showLogin(){

    document.getElementById(
        "loginForm"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "registerForm"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "loginTab"
    ).classList.add(
        "active"
    );


    document.getElementById(
        "registerTab"
    ).classList.remove(
        "active"
    );


    showMessage(
        "",
        ""
    );

}


/* =====================================================
   REGISTER TAB
===================================================== */

function showRegister(){

    document.getElementById(
        "registerForm"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "loginForm"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "registerTab"
    ).classList.add(
        "active"
    );


    document.getElementById(
        "loginTab"
    ).classList.remove(
        "active"
    );


    showMessage(
        "",
        ""
    );

}


/* =====================================================
   REGISTER STUDENT
===================================================== */

async function registerStudent(event){

    event.preventDefault();


    const name =
        document.getElementById(
            "registerName"
        ).value.trim();


    const email =
        document.getElementById(
            "registerEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "registerPassword"
        ).value;


    const password2 =
        document.getElementById(
            "registerPassword2"
        ).value;


    if(password !== password2){

        showMessage(
            "❌ The passwords do not match.",
            "error"
        );

        return;

    }


    if(password.length < 6){

        showMessage(
            "❌ Password must contain at least 6 characters.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "registerButton"
        );


    button.disabled = true;

    button.textContent =
        "Creating account...";


    showMessage(
        "⏳ Creating your student account...",
        "info"
    );


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{

                data:{

                    full_name:name

                }

            }

        });


        if(error){

            throw error;

        }


        /*
         * Supabase may require email confirmation.
         * If confirmation is disabled, a session
         * may already exist.
         */


        if(data.user){

            /*
             * Create profile when a session
             * is available.
             */

            if(data.session){

                const {
                    error:profileError
                } =
                await supabaseClient
                    .from("profiles")
                    .upsert({

                        id:data.user.id,

                        full_name:name,

                        role:"student"

                    });


                if(profileError){

                    console.error(
                        profileError
                    );

                }

            }


            if(data.session){

                showMessage(
                    "✅ Account created! Opening your dashboard...",
                    "success"
                );


                localStorage.setItem(
                    "brightAcademyLoggedIn",
                    "true"
                );


                localStorage.setItem(
                    "brightAcademyStudent",
                    JSON.stringify({

                        id:data.user.id,

                        fullname:name,

                        email:email

                    })
                );


                setTimeout(
                    function(){

                        window.location.href =
                            "student-dashboard.html";

                    },
                    1000
                );


            }
            else{

                showMessage(
                    "✅ Account created! Check your email to confirm your account, then return here and log in.",
                    "success"
                );


                document.getElementById(
                    "registerForm"
                ).reset();

            }

        }

    }
    catch(error){

        console.error(
            "Registration error:",
            error
        );


        showMessage(
            "❌ " +
            getFriendlyError(
                error
            ),
            "error"
        );

    }
    finally{

        button.disabled = false;

        button.textContent =
            "📝 Create Student Account";

    }

}


/* =====================================================
   LOGIN STUDENT
===================================================== */

async function loginStudent(event){

    event.preventDefault();


    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    const button =
        document.getElementById(
            "loginButton"
        );


    button.disabled = true;

    button.textContent =
        "Logging in...";


    showMessage(
        "⏳ Checking your account...",
        "info"
    );


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.signInWithPassword({

            email:email,

            password:password

        });


        if(error){

            throw error;

        }


        if(!data.user){

            throw new Error(
                "Unable to find your account."
            );

        }


        /*
         * Get profile from database.
         */

        let profile = null;


        const {
            data:profileData,
            error:profileError
        } =
        await supabaseClient
            .from("profiles")
            .select(
                "id, full_name, role"
            )
            .eq(
                "id",
                data.user.id
            )
            .maybeSingle();


        if(profileError){

            console.error(
                profileError
            );

        }
        else{

            profile =
                profileData;

        }


        /*
         * If profile does not exist,
         * create it.
         */

        if(!profile){

            const name =
                data.user.user_metadata
                    ?.full_name ||
                email.split("@")[0];


            const {
                data:newProfile,
                error:newProfileError
            } =
            await supabaseClient
                .from("profiles")
                .insert({

                    id:data.user.id,

                    full_name:name,

                    role:"student"

                })
                .select()
                .single();


            if(newProfileError){

                throw newProfileError;

            }


            profile =
                newProfile;

        }


        /*
         * Do not allow the student login
         * page to enter the teacher area.
         */

        if(profile.role === "teacher"){

            showMessage(
                "👨‍🏫 This is a teacher account. Please use the teacher login.",
                "error"
            );


            await supabaseClient.auth.signOut();


            button.disabled = false;

            button.textContent =
                "🔐 Login";


            return;

        }


        /*
         * Save compatibility data.
         */

        localStorage.setItem(
            "brightAcademyLoggedIn",
            "true"
        );


        localStorage.setItem(
            "brightAcademyStudent",
            JSON.stringify({

                id:data.user.id,

                fullname:
                    profile.full_name,

                email:
                    data.user.email

            })
        );


        showMessage(
            "✅ Login successful! Opening your dashboard...",
            "success"
        );


        setTimeout(
            function(){

                window.location.href =
                    "student-dashboard.html";

            },
            700
        );

    }
    catch(error){

        console.error(
            "Login error:",
            error
        );


        showMessage(
            "❌ " +
            getFriendlyError(
                error
            ),
            "error"
        );


        button.disabled = false;

        button.textContent =
            "🔐 Login";

    }

}


/* =====================================================
   FRIENDLY ERRORS
===================================================== */

function getFriendlyError(error){

    const message =
        error?.message ||
        "Something went wrong.";


    if(
        message
        .toLowerCase()
        .includes(
            "invalid login credentials"
        )
    ){

        return "Email or password is incorrect.";

    }


    if(
        message
        .toLowerCase()
        .includes(
            "user already registered"
        )
    ){

        return "This email is already registered. Please log in.";

    }


    if(
        message
        .toLowerCase()
        .includes(
            "password should be at least"
        )
    ){

        return "Password must contain at least 6 characters.";

    }


    if(
        message
        .toLowerCase()
        .includes(
            "email not confirmed"
        )
    ){

        return "Please confirm your email before logging in.";

    }


    return message;

}


/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

async function checkExistingSession(){

    const {
        data
    } =
    await supabaseClient.auth.getSession();


    if(
        data &&
        data.session &&
        data.session.user
    ){

        /*
         * Already logged in.
         * Send the student directly
         * to the dashboard.
         */

        const user =
            data.session.user;


        const {
            data:profile
        } =
        await supabaseClient
            .from("profiles")
            .select(
                "id, full_name, role"
            )
            .eq(
                "id",
                user.id
            )
            .maybeSingle();


        if(
            profile &&
            profile.role === "student"
        ){

            localStorage.setItem(
                "brightAcademyLoggedIn",
                "true"
            );


            localStorage.setItem(
                "brightAcademyStudent",
                JSON.stringify({

                    id:user.id,

                    fullname:
                        profile.full_name,

                    email:
                        user.email

                })
            );


            window.location.href =
                "student-dashboard.html";

        }

    }

}


/* =====================================================
   START
===================================================== */

checkExistingSession();


</script>


</body>

</html>
